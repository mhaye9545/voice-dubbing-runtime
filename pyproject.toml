[project]
name = "voice-dubbing-runtime"
version = "0.1.0"
description = "Isolated CPU-only Voice Dubbing Phase 1 research probe"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub==0.36.2",
    "numpy==1.26.4",
    "psutil==7.2.2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==4.49.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6,<7",
]

[tool.setuptools.packages.find]
include = [
    "voice_dubbing_runtime*",
    "voice_dubbing_app*",
]
exclude = [
    "tests*",
    "runs*",
    "models*",
    "vendor*",
    "compat_backup*",
    "scripts*",
]

[tool.setuptools.package-data]
voice_dubbing_runtime = ["config/*.json"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
